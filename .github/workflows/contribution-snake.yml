name: Refresh contribution visuals

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate contribution visuals
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: icecold009
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=purple

      - name: Generate contribution activity card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/generate-contribution-card.mjs

      - name: Commit updated contribution visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-contribution-grid-snake.svg dist/github-contribution-activity.svg
          if git diff --cached --quiet; then
            echo "No contribution changes."
            exit 0
          fi
          git commit -m "chore: refresh contribution visuals"
          git push
